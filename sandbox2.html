<div class="local-sandbox" style="display: flex; flex-direction: column; height: 520px; border: 1px solid #333; border-radius: 8px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; overflow: hidden; background: #1e1e1e; color: #fff; margin: 20px 0;">

  <!-- Editor Panes Header -->
  <div style="display: flex; flex: 1; min-height: 0;">

    <!-- HTML Input -->
    <div style="flex: 1; display: flex; flex-direction: column; border-right: 1px solid #333;">
      <div style="background: #2d2d2d; padding: 6px 10px; font-size: 12px; font-weight: bold; color: #ff6c6b;">HTML</div>
      <textarea id="box-html" style="flex: 1; background: #1e1e1e; color: #d4d4d4; border: none; padding: 10px; resize: none; font-family: monospace; outline: none; font-size: 13px; line-height: 1.4;"><div class="card">
  <h2>Hello World</h2>
  <p>Type code above to see it live!</p>
</div></textarea>
    </div>

    <!-- CSS Input -->
    <div style="flex: 1; display: flex; flex-direction: column; border-right: 1px solid #333;">
      <div style="background: #2d2d2d; padding: 6px 10px; font-size: 12px; font-weight: bold; color: #61afef;">CSS</div>
      <textarea id="box-css" style="flex: 1; background: #1e1e1e; color: #d4d4d4; border: none; padding: 10px; resize: none; font-family: monospace; outline: none; font-size: 13px; line-height: 1.4;">body {
  background: #f4f4f9;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
}
.card {
  background: white;
  padding: 20px;
  border-radius: 8px;
  box-shadow: 0 4px 6px rgba(0,0,0,0.1);
}</textarea>
    </div>

    <!-- JS Input -->
    <div style="flex: 1; display: flex; flex-direction: column;">
      <div style="background: #2d2d2d; padding: 6px 10px; font-size: 12px; font-weight: bold; color: #e5c07b;">JavaScript</div>
      <textarea id="box-js" style="flex: 1; background: #1e1e1e; color: #d4d4d4; border: none; padding: 10px; resize: none; font-family: monospace; outline: none; font-size: 13px; line-height: 1.4;">// Optional script goes here
console.log("Sandbox ready.");</textarea>
    </div>

  </div>

  <!-- Live Output Preview Frame -->
  <div style="flex: 1; display: flex; flex-direction: column; border-top: 2px solid #333;">
    <div style="background: #2d2d2d; padding: 4px 10px; font-size: 11px; color: #888;">Live Preview</div>
    <iframe id="box-preview" style="flex: 1; border: none; background: #fff;" sandbox="allow-scripts"></iframe>
  </div>

</div>

<!-- Real-time rendering engine script -->
<script>
  (function() {
    const hInput = document.getElementById('box-html');
    const cInput = document.getElementById('box-css');
    const jInput = document.getElementById('box-js');
    const previewFrame = document.getElementById('box-preview');

    function renderSandbox() {
      const safeJsTag = 'script';
      const code = `
        <!DOCTYPE html>
        <html>
          <head>
            <meta charset="UTF-8">
            <style>${cInput.value}</style>
          </head>
          <body>
            ${hInput.value}
            <${safeJsTag}>
              try {
                ${jInput.value}
              } catch(err) {
                console.error(err);
              }
            </${safeJsTag}>
          </body>
        </html>
      `;

      const blob = new Blob([code], { type: 'text/html' });
      previewFrame.src = URL.createObjectURL(blob);
    }

    [hInput, cInput, jInput].forEach(element => {
      element.addEventListener('input', renderSandbox);
    });

    renderSandbox();
  })();
</script>

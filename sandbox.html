<div class="local-sandbox" style="display: flex; flex-direction: column; height: 550px; border: 1px solid #333; border-radius: 8px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif, mono; overflow: hidden; background: #1e1e1e; color: #fff; margin: 20px 0;">

  <!-- Toolbar / Header with Save Button -->
  <div style="display: flex; justify-content: space-between; align-items: center; background: #3d3b4f; padding: 6px 12px; border-bottom: 1px solid #333;">
    <span style="font-size: 12px; font-weight: bold; color: #888;">WebFledgling Editor</span>
    <button onclick="downloadSandbox()" style="background: #674fc6; color: #efedfc; border: none; padding: 10px; border-radius: 15px; cursor: pointer; display: flex; align-items: center; gap: 5px;" title="Saves your HTML code to your computer">
      Save
    </button>
  </div>

  <!-- Editor Panes Header -->
  <div style="display: flex; flex: 1; min-height: 0;">

    <!-- HTML Input -->
    <div style="flex: 1; display: flex; flex-direction: column; border-right: 1px solid #333;">
      <div style="background: #1d1c23; padding: 6px 10px; font-size: 12px; font-weight: bold; color: #ff6c6b;">HTML</div>
      <textarea id="box-html" style="flex: 1; background: #1e1e1e; color: #d4d4d4; border: none; padding: 10px; resize: none; font-family: mono; outline: none; font-size: 13px; line-height: 1.4;"> <!-- HTML defines your site's content -->
  <div class="card">
  <h2>Hello, World!</h2>
  <p>Lorem Ipsum Dolor Sit Amet</p>
</div></textarea>
    </div>

    <!-- CSS Input -->
    <div style="flex: 1; display: flex; flex-direction: column; border-right: 1px solid #333;">
      <div style="background: #1d1c23; padding: 6px 10px; font-size: 12px; font-weight: bold; color: #61afef;">CSS</div>
      <textarea id="box-css" style="flex: 1; background: #1e1e1e; color: #d4d4d4; border: none; padding: 10px; resize: none; font-family: mono; outline: none; font-size: 13px; line-height: 1.4;">/* CSS defines how your site looks */
  body {
  background: #f4f4f9;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
}
.card {
  background: white;
  padding: 20px;
  border-radius: 8px;
  box-shadow: 0 4px 6px rgba(0,0,0,0.1);
}</textarea>
    </div>

    <!-- JS Input -->
    <div style="flex: 1; display: flex; flex-direction: column;">
      <div style="background: #1d1c23; padding: 6px 10px; font-size: 12px; font-weight: bold; color: #e5c07b;">JavaScript</div>
      <textarea id="box-js" style="flex: 1; background: #1e1e1e; color: #d4d4d4; border: none; padding: 10px; resize: none; font-family: mono; outline: none; font-size: 13px; line-height: 1.4;">// JavaScript gives your site functionality
console.log("Sandbox ready.");</textarea>
    </div>

  </div>

  <!-- Live Output Preview Frame -->
  <div style="flex: 1; display: flex; flex-direction: column; border-top: 2px solid #333;">
    <div style="background: #2d2d2d; padding: 4px 10px; font-size: 11px; color: #888;">Live Preview</div>
    <iframe id="box-preview" style="flex: 1; border: none; background: #fff;" sandbox="allow-scripts"></iframe>
  </div>

</div>

<!-- Real-time rendering and save engine script -->
<script>
  (function() {
    const hInput = document.getElementById('box-html');
    const cInput = document.getElementById('box-css');
    const jInput = document.getElementById('box-js');
    const previewFrame = document.getElementById('box-preview');

    // 1. Load any previously auto-saved code from browser LocalStorage
    if (localStorage.getItem('sandbox_html')) hInput.value = localStorage.getItem('sandbox_html');
    if (localStorage.getItem('sandbox_css')) cInput.value = localStorage.getItem('sandbox_css');
    if (localStorage.getItem('sandbox_js')) jInput.value = localStorage.getItem('sandbox_js');

    function buildCompleteDocument() {
      const safeJsTag = 'script';
      return `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saved Sandbox Website</title>
  <style>
    ${cInput.value}
  </style>
</head>
<body>
  ${hInput.value}
  <${safeJsTag}>
    try {
      ${jInput.value}
    } catch(err) {
      console.error(err);
    }
  </${safeJsTag}>
</body>
</html>`;
    }

    function renderSandbox() {
      const fullDoc = buildCompleteDocument();

      // Update preview via Blob URL
      const blob = new Blob([fullDoc], { type: 'text/html' });
      previewFrame.src = URL.createObjectURL(blob);

      // Auto-save changes locally so user doesn't lose progress on refresh
      localStorage.setItem('sandbox_html', hInput.value);
      localStorage.setItem('sandbox_css', cInput.value);
      localStorage.setItem('sandbox_js', jInput.value);
    }

    // Attach listener to inputs
    [hInput, cInput, jInput].forEach(element => {
      element.addEventListener('input', renderSandbox);
    });

    // Global function for the Download/Save button
    window.downloadSandbox = function() {
      const fullDoc = buildCompleteDocument();
      const blob = new Blob([fullDoc], { type: 'text/html;charset=utf-8' });
      const url = URL.createObjectURL(blob);

      const a = document.createElement('a');
      a.href = url;
      a.download = 'my-sandbox-website.html';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    };

    renderSandbox();
  })();
</script>
